AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: posture-bot - hourly photo at a random second (Lambda + EventBridge Scheduler + DynamoDB)

Parameters:
  TokenParam:
    Type: String
    Default: /posture-bot/token
    Description: SSM SecureString parameter holding the BotFather token
  CatchupGrace:
    Type: Number
    Default: 120
    MinValue: 60
    MaxValue: 3600
    Description: Max seconds a slot may start late (AWS retries); later slots are dropped, never sent late
  SendRate:
    Type: Number
    Default: 25
  Caption:
    Type: String
    Default: ""
  DisplayTz:
    Type: String
    Default: Europe/Berlin
  AllowedChannels:
    Type: String
    Default: ""
    Description: Comma-separated @usernames / -100 ids of channels allowed to subscribe (empty = any)

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: src/
    MemorySize: 256
    LoggingConfig:
      LogGroup: !Ref LogGroup
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        STATE_TABLE: !Ref StateTable
        TOKEN_PARAM: !Ref TokenParam
        CATCHUP_GRACE: !Ref CatchupGrace
        SEND_RATE: !Ref SendRate
        CAPTION: !Ref Caption
        DISPLAY_TZ: !Ref DisplayTz
        ALLOWED_CHANNELS: !Ref AllowedChannels
        SCHEDULE_GROUP: !Ref ScheduleGroup
        SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
        BROADCAST_ARN: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:posture-bot-broadcast
        DLQ_ARN: !GetAtt DeadLetterQueue.Arn

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/posture-bot
      RetentionInDays: 14

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: posture-bot-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: chat_id
          AttributeType: N
      KeySchema:
        - AttributeName: chat_id
          KeyType: HASH

  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: posture-bot-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: posture-bot-dlq
      MessageRetentionPeriod: 1209600

  ScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: posture-bot

  # Role EventBridge Scheduler assumes to invoke broadcast for one-time slot schedules
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:posture-bot-broadcast
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DeadLetterQueue.Arn

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: posture-bot-webhook
      Handler: app.webhook
      Timeout: 30
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TokenParam}

  BroadcastFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: posture-bot-broadcast
      Handler: app.broadcast
      Timeout: 900
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: !Ref CatchupGrace
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TokenParam}
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:posture-bot-broadcast

  PlannerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: posture-bot-planner
      Handler: app.planner
      Timeout: 120
      Environment:
        Variables:
          WEBHOOK_URL: !GetAtt WebhookFunctionUrl.FunctionUrl
      Events:
        Hourly:
          Type: ScheduleV2
          Properties:
            Name: posture-bot-planner
            ScheduleExpression: rate(1 hour)
            RetryPolicy:
              MaximumRetryAttempts: 5
              MaximumEventAgeInSeconds: 3000
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TokenParam}
            - Effect: Allow
              Action: scheduler:ListSchedules
              Resource: "*"
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:GetSchedule
                - scheduler:DeleteSchedule
              Resource: !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/posture-bot/*
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerRole.Arn

  # Runs the planner on every create/update (schedules slots, registers the
  # Telegram webhook) and removes the webhook on stack delete, so a plain
  # `sam deploy` sets everything up.
  PostDeploy:
    Type: Custom::PostDeploy
    DependsOn: BroadcastFunction
    Properties:
      ServiceToken: !GetAtt PlannerFunction.Arn
      WebhookUrl: !GetAtt WebhookFunctionUrl.FunctionUrl
      CatchupGrace: !Ref CatchupGrace
      SetupVersion: "1"

Outputs:
  WebhookUrl:
    Value: !GetAtt WebhookFunctionUrl.FunctionUrl
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  Setup:
    Description: Result of the post-deploy setup (schedules + webhook)
    Value: !GetAtt PostDeploy.Webhook
