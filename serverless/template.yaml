AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: posture-bot - hourly photo at a random second from any number of Telegram bots (Lambda + EventBridge Scheduler + DynamoDB + SSM)

Parameters:
  SsmPrefix:
    Type: String
    Default: /posture-bot
    Description: SSM path holding bots/<username>/{token,admins}, admin-token and super-admin
  CatchupGrace:
    Type: Number
    Default: 120
    MinValue: 60
    MaxValue: 3600
    Description: Max seconds a slot may start late (AWS retries); later slots are dropped, never sent late
  SendRate:
    Type: Number
    Default: 25
  DisplayTz:
    Type: String
    Default: Europe/Berlin

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: src/
    MemorySize: 256
    LoggingConfig:
      LogGroup: !Ref LogGroup
    Environment:
      Variables:
        BOTS_TABLE: !Ref BotsTable
        SUBS_TABLE: !Ref SubsTable
        STATE_TABLE: !Ref StateTable
        SSM_PREFIX: !Ref SsmPrefix
        CATCHUP_GRACE: !Ref CatchupGrace
        SEND_RATE: !Ref SendRate
        DISPLAY_TZ: !Ref DisplayTz
        SCHEDULE_GROUP: !Ref ScheduleGroup
        SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
        BROADCAST_ARN: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:posture-bot-broadcast
        DLQ_ARN: !GetAtt DeadLetterQueue.Arn

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/posture-bot
      RetentionInDays: 14

  # Per-bot settings and status. Edit enabled / caption / allowed_channels here.
  BotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: posture-bot-bots
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH

  SubsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: posture-bot-subs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bot
          AttributeType: S
        - AttributeName: chat_id
          AttributeType: N
      KeySchema:
        - AttributeName: bot
          KeyType: HASH
        - AttributeName: chat_id
          KeyType: RANGE

  # Single-bot era subscribers; copied into SubsTable by the PostDeploy migration.
  # Retained (not deleted) if removed from the template later.
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: posture-bot-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: chat_id
          AttributeType: N
      KeySchema:
        - AttributeName: chat_id
          KeyType: HASH

  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: posture-bot-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: posture-bot-dlq
      MessageRetentionPeriod: 1209600

  ScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: posture-bot

  # Role EventBridge Scheduler assumes to invoke broadcast for one-time slot schedules
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:posture-bot-broadcast
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DeadLetterQueue.Arn

  # Shared webhook for all bots; the bot is identified by its secret header.
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: posture-bot-webhook
      Handler: app.webhook
      Timeout: 60
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BotsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - Statement:
            - Effect: Allow
              Action: ["ssm:GetParameter", "ssm:GetParametersByPath"]
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*

  # Super-admin bot: its own URL and secret; answers only the super admin.
  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: posture-bot-admin
      Handler: app.admin_webhook
      Timeout: 60
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          WEBHOOK_URL: !GetAtt WebhookFunctionUrl.FunctionUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BotsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - Statement:
            - Effect: Allow
              Action: ["ssm:GetParameter", "ssm:GetParametersByPath"]
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Effect: Allow
              Action: ["ssm:PutParameter", "ssm:DeleteParameter", "ssm:DeleteParameters"]
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/bots/*

  BroadcastFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: posture-bot-broadcast
      Handler: app.broadcast
      Timeout: 900
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: !Ref CatchupGrace
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BotsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - Statement:
            - Effect: Allow
              Action: ["ssm:GetParameter", "ssm:GetParametersByPath"]
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:posture-bot-broadcast

  PlannerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: posture-bot-planner
      Handler: app.planner
      Timeout: 300
      Environment:
        Variables:
          WEBHOOK_URL: !GetAtt WebhookFunctionUrl.FunctionUrl
          ADMIN_WEBHOOK_URL: !GetAtt AdminFunctionUrl.FunctionUrl
          LEGACY_USERS_TABLE: !Ref UsersTable
      Events:
        Hourly:
          Type: ScheduleV2
          Properties:
            Name: posture-bot-planner
            ScheduleExpression: rate(1 hour)
            RetryPolicy:
              MaximumRetryAttempts: 5
              MaximumEventAgeInSeconds: 3000
        # Adding/changing/deleting a token or admin list in SSM syncs that bot within seconds
        SsmChange:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: ["aws.ssm"]
              detail-type: ["Parameter Store Change"]
              detail:
                name:
                  - prefix: !Sub "${SsmPrefix}/"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BotsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action: ["ssm:GetParameter", "ssm:GetParametersByPath"]
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            - Effect: Allow
              Action: ssm:PutParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/bots/*
            - Effect: Allow
              Action: scheduler:ListSchedules
              Resource: "*"
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:GetSchedule
                - scheduler:DeleteSchedule
              Resource: !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/posture-bot/*
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerRole.Arn

  # Runs the planner on every create/update (legacy migration, slot schedules,
  # webhooks for every bot and the admin bot) and removes webhooks on stack
  # delete, so a plain `sam deploy` sets everything up.
  PostDeploy:
    Type: Custom::PostDeploy
    DependsOn: BroadcastFunction
    Properties:
      ServiceToken: !GetAtt PlannerFunction.Arn
      WebhookUrl: !GetAtt WebhookFunctionUrl.FunctionUrl
      AdminWebhookUrl: !GetAtt AdminFunctionUrl.FunctionUrl
      CatchupGrace: !Ref CatchupGrace
      SetupVersion: "2"

Outputs:
  WebhookUrl:
    Value: !GetAtt WebhookFunctionUrl.FunctionUrl
  AdminWebhookUrl:
    Value: !GetAtt AdminFunctionUrl.FunctionUrl
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  Setup:
    Description: Result of the post-deploy setup per bot
    Value: !GetAtt PostDeploy.Webhook
  Migration:
    Value: !GetAtt PostDeploy.Migration
  AdminBot:
    Value: !GetAtt PostDeploy.AdminBot
